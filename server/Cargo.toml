[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tempdir = "0.3.7"
yaml-rust2 = "0.12.0"
diesel = { version="2.3.13", "features"=["sqlite", "chrono", "r2d2"] }
libsqlite3-sys = { version = "0.29", features = ["bundled"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
r2d2 = "0.8.10"
openssl = "0.10.81"
tokio-rustls = "0.26.5"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
serde = { version = "1.0.188", features = ["derive"] }
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4"] }

